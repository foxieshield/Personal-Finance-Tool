<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Finance Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Personal Finance Tracker</h1>

    <main>

        <section>
            <h2>Financial Information</h2>

            <label for="creditLimit">Credit Card Credit</label>
            <input type="number" id="creditLimit" placeholder="Enter available credit">

            <label for="creditDebt">Credit Card Current Debt</label>
            <input type="number" id="creditDebt" placeholder="Enter current debt">

            <label for="debitMoney">Debit Card Current Money</label>
            <input type="number" id="debitMoney" placeholder="Enter current money">

            <button id="calculateButton">Calculate Current Stock</button>
        </section>
        
       <section>
    <h2>Financial Summary</h2>

    <p>Available Credit: <span id="availableCredit">$0.00</span></p>

    <p>Current Stock: <span id="currentStock">$0.00</span></p>
</section>

        <section>
    <h2>Add Movement</h2>

    <label for="movementName">Name</label>
    <input type="text" id="movementName" placeholder="e.g. Groceries">

    <label for="movementDate">Date</label>
    <input type="date" id="movementDate">

    <label for="movementAmount">Amount</label>
    <input type="number" id="movementAmount" placeholder="Enter amount">

    <label for="movementAccount">Account</label>
    <select id="movementAccount">
        <option value="debit">Debit Card</option>
        <option value="credit">Credit Card</option>
    </select>


<section>
    <h2>Movements</h2>

    <div id="movementsList"></div>
</section>
            
    <label for="movementType">Type</label>
    <select id="movementType">
        <option value="income">Income</option>
        <option value="expenditure">Expenditure</option>
    </select>

    <button id="addMovementButton">Add Movement</button>
</section>
        
    </main>

    <script src="script.js"></script>

</body>
</html>
