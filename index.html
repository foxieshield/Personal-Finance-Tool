<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Finance Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="themeButton">🌙 Dark Mode</button>
    
    <h1>Personal Finance Tracker</h1>

    <main>
        
            <section>
    <h2>Add Card / Account</h2>

    <label for="cardName">Card name</label>
    <input type="text" id="cardName" placeholder="e.g. BBVA •••• 1234">

    <label for="cardType">Type</label>
    <select id="cardType">
    <option value="" selected disabled>Select card type</option>
    <option value="debit">Debit Card</option>
    <option value="credit">Credit Card</option>
      </select>

    <div id="creditFields">
        <label for="creditLimit">Credit Limit</label>
        <input type="number" id="creditLimit" placeholder="Enter credit limit">

        <label for="creditDebt">Current Debt</label>
        <input type="number" id="creditDebt" placeholder="Enter current debt">
    </div>

    <div id="debitFields">
        <label for="debitMoney">Current Money</label>
        <input type="number" id="debitMoney" placeholder="Enter current money">
    </div>

    <button id="addCardButton">Add Card</button>
             </section>

<section>
    <h2>Your Cards / Accounts</h2>

    <div id="cardsList"></div>
</section> 
        
<section>
    <h2>Financial Summary</h2>

    <p>
        Total Available:
        <span id="totalAvailable">$0.00</span>
    </p>
</section>
              <section>
          <h2>Add Movement</h2>

    <label for="movementName">Name</label>
    <input type="text" id="movementName" placeholder="e.g. Groceries">

    <label for="movementDate">Date</label>
    <input type="date" id="movementDate">

    <label for="movementAmount">Amount</label>
    <input type="number" id="movementAmount" placeholder="Enter amount">

    <label for="movementCard">Card / Account</label>
<select id="movementCard">
</select>
            
    <label for="movementType">Type</label>
    <select id="movementType">
        <option value="income">Income</option>
        <option value="expenditure">Expenditure</option>
    </select>

    <button id="addMovementButton">Add Movement</button>
             </section>

     <section>
          <h2>Movements</h2>

          <div id="movementsList"></div>
     </section>
        
    </main>

<div id="deleteCardModal" class="modal">

    <div class="modal-content">

        <h2>Delete Card</h2>

        <p id="deleteCardMessage"></p>

        <label>
            <input type="checkbox" id="deleteRelatedMovements">
            Delete movements related to this card
        </label>

        <div class="modal-buttons">

            <button id="cancelDeleteCard">
                Cancel
            </button>

            <button id="confirmDeleteCard">
                Delete Card
            </button>

        </div>

    </div>

</div>
    
    <script src="script.js"></script>


    
</body>
</html>
